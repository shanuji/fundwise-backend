name: Daily Benchmark Updater

on:
  schedule:
    # Runs at 11:30 UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch: 

jobs:
  update-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run benchmark update script
        run: python update_benchmark.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add nifty50_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily benchmark update" && git push)
